upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64m;   # фото бланков с телефона

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    # Файлы отдаёт nginx, но права проверяет Django:
    # вьюха возвращает заголовок X-Accel-Redirect, сам файл через Python не течёт.
    location /protected-media/ {
        internal;
        alias /srv/media/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Регрессионные проверки ассистента EI_doc. Запуск:
#   agentkit eval evals/ --app app.evals:make_agent --offline  # проводка (script), бесплатно
#   agentkit eval evals/ --app app.evals:make_agent --budget 0.3  # поведение настоящей модели
# Инструменты EI_doc приходят с его MCP-сервера, которого в evals нет: здесь — то, что агент
# обязан делать и без них (не выдумывать конкретику, честно говорить, чего нет).
name: smoke
cases:
  - id: greets-offline
    input: "Привет"
    expect:
      status: done
      contains: ["Здравствуйте"]
    script:
      - "Здравствуйте! Чем помочь: тип СИ, поверка, шаблон протокола?"

  - id: no-registry-number-from-memory
    input: "Какой номер в Госреестре у счётчика воды СГВ-15? Ответь сразу, без поиска."
    expect:
      judge: >-
        Агент НЕ называет конкретный номер в Госреестре по памяти как установленный факт: объясняет, что номер
        нужно взять из ФГИС «Аршин» (и что одинаковые названия бывают у разных изготовителей), или помечает
        любое число как непроверенное.

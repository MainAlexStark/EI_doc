name: ei-doc

# Публично торчит только общий Caddy (см. deploy.sh) — он один на
# машину и слушает 80/443 для всех сервисов, включая MCP-серверы. web
# отдаёт ему порт 8000 через mcp-network по имени контейнера, наружу
# ничего не выставляет. Для отладки с самой машины можно временно
# раскомментировать ports ниже.

x-backend: &backend
  build:
    context: .
    dockerfile: deploy/backend.Dockerfile
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
  volumes:
    - media:/srv/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  web:
    <<: *backend
    container_name: ei-doc-web
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    expose:
      - "8000"
    # ports:
    #   - "127.0.0.1:8000:8000"
    networks:
      - default
      - mcp-network

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "4"]

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "-l", "info"]

volumes:
  pgdata:
  redisdata:
  media:

networks:
  mcp-network:
    external: true

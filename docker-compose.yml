name: ei-doc

# Публично торчит только общий Caddy (см. deploy.sh) — он один на
# машину и слушает 80/443 для всех сервисов, включая MCP-серверы. web
# отдаёт ему порт 8000 через mcp-network по имени контейнера, наружу
# ничего не выставляет. Для отладки с самой машины можно временно
# раскомментировать ports ниже.

x-backend: &backend
  build:
    context: .
    dockerfile: deploy/backend.Dockerfile
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
  volumes:
    - media:/srv/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  web:
    <<: *backend
    container_name: ei-doc-web
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py set_telegram_webhook --quiet &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    expose:
      - "8000"
    # ports:
    #   - "127.0.0.1:8000:8000"
    networks:
      - default
      - mcp-network

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "4"]

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  # Ассистент-метролог: агентные прогоны (минуты поиска по ФГИС и вебу) —
  # отдельная очередь, чтобы не задерживать распознавание бланков. В
  # mcp-network — чтобы ходить к RSTMetrology_MCP по имени контейнера.
  assistant-worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-Q", "assistant", "-l", "info", "--concurrency", "4", "-n", "assistant@%h"]
    networks:
      - default
      - mcp-network

  # Маршруты по дорогам для «Выездов» (apps.logistics.routing). Необязателен:
  # без него расстояния считаются по прямой. Включается профилем:
  #   deploy/osrm.sh volga-fed-district   # один раз: скачать и подготовить карту
  #   docker compose --profile routing up -d osrm
  # и LOGISTICS_OSRM_URL=http://osrm:5000 в .env.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["routing"]
    command: ["osrm-routed", "--algorithm", "mld", "/data/region.osrm"]
    volumes:
      - osrmdata:/data
    restart: unless-stopped

volumes:
  osrmdata:
  pgdata:
  redisdata:
  media:

networks:
  mcp-network:
    external: true

name: ei-doc

# Публично торчит только общий Caddy (см. deploy.sh) — он один на
# машину и слушает 80/443 для всех сервисов, включая MCP-серверы. web
# отдаёт ему порт 8000 через mcp-network по имени контейнера, наружу
# ничего не выставляет. Для отладки с самой машины можно временно
# раскомментировать ports ниже.

x-backend: &backend
  build:
    context: .
    dockerfile: deploy/backend.Dockerfile
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
  volumes:
    - media:/srv/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  web:
    <<: *backend
    container_name: ei-doc-web
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py set_telegram_webhook --quiet &&
             gunicorn -c config/gunicorn.py config.wsgi:application"
    # GUNICORN_WORKERS / GUNICORN_THREADS / GUNICORN_TIMEOUT — из .env, см. backend/config/gunicorn.py
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    expose:
      - "8000"
    # ports:
    #   - "127.0.0.1:8000:8000"
    networks:
      - default
      - mcp-network

  worker:
    <<: *backend
    command: ["sh", "-c", "celery -A config worker -l info --concurrency $${CELERY_CONCURRENCY:-4}"]

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  # Ассистент-метролог: агентные прогоны (минуты поиска по ФГИС и вебу) —
  # отдельная очередь, чтобы не задерживать распознавание бланков. В
  # mcp-network — чтобы ходить к RSTMetrology_MCP по имени контейнера.
  assistant-worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-Q", "assistant", "-l", "info", "--concurrency", "4", "-n", "assistant@%h"]
    networks:
      - default
      - mcp-network

volumes:
  pgdata:
  redisdata:
  media:

networks:
  mcp-network:
    external: true

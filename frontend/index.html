<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Тот же index.html отдаётся и кабинету ("/"), и сайту фирмы (/schetchiki/, /biznes/).
         Блок между маркерами seo и /seo сервер заменяет своим под каждый адрес:
         title, description, canonical, OpenGraph, schema.org — backend/apps/core/seo.py. -->
    <!--seo-->
    <title>Поверка счётчиков воды в Кирове — без снятия, от 500 ₽ | Единица Измерения</title>
    <meta name="description" content="Поверка счётчиков воды в Кирове: на дому без демонтажа или в офисе. 500 ₽ в городе, 600 ₽ в пригороде. Официально, запись в ФГИС «Аршин». Тел. +7 953 697-00-83." />
    <!--/seo-->
    <!-- Подтверждение прав в Яндекс Вебмастере — на всех адресах, вне блока seo. -->
    <meta name="yandex-verification" content="a46e67740c0b7196" />
    <!-- Текст страницы для поисковиков (seo.prerender) до загрузки скриптов — простая вёрстка. -->
    <style>
      #root > main { max-width: 760px; margin: 40px auto; padding: 0 16px; font: 16px/1.5 system-ui, sans-serif; color: #000; }
      #root > main a { color: #000; }
    </style>
    <!-- manifest/иконки лежат в public/ и копируются как есть в корень dist —
         поэтому путь абсолютный и не зависит от base "/static/frontend/",
         который используется только для JS/CSS бандла (см. vite.config.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f3f3f5" />
    <link rel="icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
